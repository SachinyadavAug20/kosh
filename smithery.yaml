# Smithery MCP Server Manifest
# https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      geminiApiKey:
        type: string
        description: Google Gemini API key for natural language CAD operations
      blenderPath:
        type: string
        description: Custom path to headless Blender executable
  command: bash
  args:
    - -c
    - "mvn -f backend/pom.xml spring-boot:run -Dspring-boot.run.arguments=--server.port=8080"
