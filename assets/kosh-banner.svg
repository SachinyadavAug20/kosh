<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="100%" stopColor="#0f0f11" />
    </linearGradient>

    <!-- Facet Gradients -->
    <linearGradient id="l-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#383c47" />
      <stop offset="100%" stopColor="#252830" />
    </linearGradient>

    <linearGradient id="l-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#252830" />
      <stop offset="100%" stopColor="#17191e" />
    </linearGradient>

    <linearGradient id="l-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1d2026" />
      <stop offset="100%" stopColor="#101114" />
    </linearGradient>

    <!-- Core Gradients -->
    <linearGradient id="l-core-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fb923c" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>

    <linearGradient id="l-core-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#ea580c" />
      <stop offset="100%" stopColor="#c2410c" />
    </linearGradient>

    <linearGradient id="l-core-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#c2410c" />
      <stop offset="100%" stopColor="#9a3412" />
    </linearGradient>

    <filter id="l-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="680" height="160" rx="16" fill="url(#logo-bg)" stroke="#27272a" stroke-width="1.5" />

  <!-- LEFT: 3D Isometric Kosh Mark (Center 90, 80; Radius 50) -->
  <g transform="translate(10, 0)">
    <!-- Outer Isometric Shell -->
    <polygon points="90,30 133,55 90,80 47,55" fill="url(#l-top)" stroke="#4b505e" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="47,55 90,80 90,130 47,105" fill="url(#l-left)" stroke="#383c46" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="90,80 133,55 133,105 90,130" fill="url(#l-right)" stroke="#282b32" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 3D Axes Lines -->
    <line x1="90" y1="80" x2="90" y2="38" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" />
    <circle cx="90" cy="38" r="2.5" fill="#3b82f6" />

    <line x1="90" y1="80" x2="126" y2="101" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <circle cx="126" cy="101" r="2.5" fill="#ef4444" />

    <line x1="90" y1="80" x2="54" y2="101" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
    <circle cx="54" cy="101" r="2.5" fill="#22c55e" />

    <!-- Glowing Orange Core -->
    <g filter="url(#l-glow)">
      <polygon points="90,61 107,71 90,80 73,71" fill="url(#l-core-top)" stroke="#fed7aa" stroke-width="1" />
      <polygon points="73,71 90,80 90,99 73,90" fill="url(#l-core-left)" stroke="#ea580c" stroke-width="1" />
      <polygon points="90,80 107,71 107,90 90,99" fill="url(#l-core-right)" stroke="#c2410c" stroke-width="1" />
    </g>
    <circle cx="90" cy="80" r="2" fill="#ffffff" />
  </g>

  <!-- RIGHT: Typography & Monospace Studio Identity -->
  <g transform="translate(175, 0)">
    <!-- Primary Title -->
    <text x="0" y="68" fill="#f4f4f5" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="36" font-weight="800" letter-spacing="4">
      KOSH
    </text>

    <!-- Version & Hub Indicator -->
    <rect x="135" y="44" width="76" height="20" rx="3" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="173" y="58" text-anchor="middle" fill="#ea580c" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1">
      v3.0 DCC
    </text>

    <!-- Subtitle Line -->
    <text x="0" y="94" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" letter-spacing="1">
      CREATIVE MCP 3D STUDIO • HEADLESS BLENDER 5.2
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="88" height="20" rx="3" fill="#1f1f23" stroke="#333338" stroke-width="1" />
      <text x="44" y="14" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="9" font-weight="600">
        PARAMETRIC CAD
      </text>

      <rect x="96" y="0" width="82" height="20" rx="3" fill="#1f1f23" stroke="#333338" stroke-width="1" />
      <text x="137" y="14" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="9" font-weight="600">
        3D SCULPTING
      </text>

      <rect x="186" y="0" width="80" height="20" rx="3" fill="#1f1f23" stroke="#333338" stroke-width="1" />
      <text x="226" y="14" text-anchor="middle" fill="#71717a" font-family="monospace" font-size="9" font-weight="600">
        DOPE SHEET
      </text>

      <rect x="274" y="0" width="102" height="20" rx="3" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1" />
      <text x="325" y="14" text-anchor="middle" fill="#ea580c" font-family="monospace" font-size="9" font-weight="700">
        20 MCP TOOLS
      </text>
    </g>
  </g>
</svg>
