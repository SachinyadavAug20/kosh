server.port=8080

# Kosh Storage Configuration
app.storage.dir=storage

# Google Gemini API Configuration (Free tier from Google AI Studio)
google.gemini.api.base-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
google.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
google.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-1.5-flash}

# BharatCode / OpenAI-Compatible API Configuration (BYOK fallback)
bharatcode.api.base-url=${BHARATCODE_API_URL:https://api.bharatcode.ai/v1}
bharatcode.api.model=${BHARATCODE_MODEL:bharatcode-v1}

# Blender Engine Configuration
blender.executable=${BLENDER_PATH:blender}
blender.timeout-seconds=45

# Logging format
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr([%p]) %clr(%logger{24}){cyan} : %m%n
