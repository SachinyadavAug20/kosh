server.port=${SERVER_PORT:8080}

# Kosh Storage & Engine Configuration
kosh.storage.dir=${STORAGE_DIR:storage}
app.storage.dir=${kosh.storage.dir}

kosh.blender.binary=${BLENDER_PATH:blender}
blender.executable=${kosh.blender.binary}
blender.timeout-seconds=45

# Kosh API Keys (Configurable via environment, overridable per session via BYOK headers)
kosh.gemini.api-key=${GEMINI_API_KEY:}
kosh.bharatcode.api-key=${BHARATCODE_API_KEY:}

# Google Gemini API Configuration (Free tier from Google AI Studio)
google.gemini.api.base-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta}
google.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
google.gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-1.5-flash}

# BharatCode / OpenAI-Compatible API Configuration
bharatcode.api.base-url=${BHARATCODE_BASE_URL:${BHARATCODE_API_URL:https://api.bharatcode.ai/v1}}
bharatcode.api.model=${BHARATCODE_MODEL:bharatcode-v1}

# Logging format
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr([%p]) %clr(%logger{24}){cyan} : %m%n
