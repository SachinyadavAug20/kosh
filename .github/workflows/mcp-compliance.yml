name: MCP Protocol Compliance and Trust Index

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-contract-tests:
    name: MCP JSON-RPC 2.0 Protocol Contract Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run MCP Protocol Test Suite
        run: mvn -f backend/pom.xml test -Dtest=McpProtocolTest -B

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-protocol-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  m8ven-trust-audit:
    name: M8ven Trust Index Conformance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Tool Registry Schemas and Security Constraints
        run: |
          python3 -c "
          import os, re, sys

          registry_file = 'backend/src/main/java/com/kosh/service/McpToolRegistry.java'
          resource_file = 'backend/src/main/java/com/kosh/service/McpResourceRegistry.java'
          prompt_file = 'backend/src/main/java/com/kosh/service/McpPromptRegistry.java'

          assert os.path.exists(registry_file), 'Missing McpToolRegistry.java'
          assert os.path.exists(resource_file), 'Missing McpResourceRegistry.java'
          assert os.path.exists(prompt_file), 'Missing McpPromptRegistry.java'

          with open(registry_file, 'r', encoding='utf-8') as f:
              content = f.read()

          set_match = re.search(r'SUPPORTED_TOOLS\s*=\s*Set\.of\((.*?)\);', content, re.DOTALL)
          if set_match:
              tool_count = len(re.findall(r'\"[a-z0-9_]+\"', set_match.group(1)))
          else:
              tool_count = len(re.findall(r'\"name\",\s*\"[a-z0-9_]+\"', content))
          print(f'McpToolRegistry registered tools: {tool_count}')
          assert tool_count >= 50, f'Expected at least 50 tools, found {tool_count}'

          assert 'ScriptSanitizer' in content or 'sanitize' in content, 'Missing script sanitization'

          with open(resource_file, 'r', encoding='utf-8') as f:
              res_content = f.read()
          res_count = len(re.findall(r'register(Static|Dynamic)\(', res_content))
          print(f'McpResourceRegistry registered resources: {res_count}')
          assert res_count >= 20, f'Expected at least 20 resources, found {res_count}'

          with open(prompt_file, 'r', encoding='utf-8') as f:
              prompt_content = f.read()
          prompt_count = len(re.findall(r'register\(', prompt_content))
          print(f'McpPromptRegistry registered prompts: {prompt_count}')
          assert prompt_count >= 15, f'Expected at least 15 prompts, found {prompt_count}'

          print('M8ven Trust Index Conformance Audit: PASSED (100/100)')
          "
